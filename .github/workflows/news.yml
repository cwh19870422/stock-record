name: 盤前新聞更新

on:
  schedule:
    - cron: '*/30 22,23,0-14 * * *'  # 台北 06:00～22:30 每 30 分鐘
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pm/news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pm/news.mjs
      - name: 存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pm/news.json
          git diff --cached --quiet && exit 0
          git commit -qm "盤前新聞 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 6; done
