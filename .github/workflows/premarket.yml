name: 盤前看板資料更新

on:
  schedule:
    - cron: '20 23 * * 0-4'  # 台北 07:20（週一～五）：夜盤、美股
    - cron: '5 9 * * 1-5'    # 台北 17:05：指數、法人、期貨
    - cron: '45 13 * * 1-5'  # 台北 21:45：融資融券
    # GitHub 排程常延遲或漏跑，多排幾次補跑
    - cron: '40 9 * * 1-5'   # 台北 17:40 補跑
    - cron: '40 10 * * 1-5'  # 台北 18:40 補跑
    - cron: '15 14 * * 1-5'  # 台北 22:15 補跑
    - cron: '45 14 * * 1-5'  # 台北 22:45 補跑
    - cron: '30 15 * * 1-5'  # 台北 23:30 補跑
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pm/fetch.mjs', 'pm/kline.mjs', 'pm/watch.json', '.github/workflows/premarket.yml']

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓資料
        run: node pm/fetch.mjs
      - name: 抓K線
        run: node pm/kline.mjs
      - name: 存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pm/data.json pm/kline.json
          git diff --cached --quiet && exit 0
          git commit -m "盤前看板資料 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
