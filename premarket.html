<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盤前看板</title>
<meta name="theme-color" content="#0f1a2e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0f1a2e;--card:#17243d;--line:#26375a;--tx:#e8eef8;--mut:#93a3bf;--up:#ff5a5a;--dn:#2ecc71;--acc:#f2b84b;--blue:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:0 0 40px}
header{position:sticky;top:0;z-index:5;background:rgba(15,26,46,.95);backdrop-filter:blur(6px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:12px}
main{max-width:760px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:inherit;display:block}
.tile .k{font-size:12px;color:var(--mut)}
.tile .v{font-size:19px;font-weight:700;margin:2px 0}
.tile .s{font-size:12px}
.sum{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.sum b{color:var(--acc)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;scroll-margin-top:70px}
details.sec h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}
.tag.up{color:var(--up);border-color:var(--up)} .tag.dn{color:var(--dn);border-color:var(--dn)} .tag.mid{color:var(--mut);border-color:var(--mut)}
.big{font-size:26px;font-weight:800;margin:4px 0 0}
.big small{font-size:15px;font-weight:600;margin-left:8px}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.how{font-size:13px;background:#0f1a2e;border-radius:8px;padding:8px 10px;margin-top:10px;color:#c9d5ea}
.how b{color:var(--acc)}
svg.bars{width:100%;height:auto;display:block;margin-top:10px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--blue);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#0f1a2e;border-radius:8px;padding:4px 8px;font-size:12px}
.stock{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.stock:last-child{border-bottom:0}
.stock .n{font-weight:700}
.stock .w{font-size:12px;color:var(--mut)}
.stock .px{text-align:right;font-weight:700}
.stock>svg{grid-column:1/3;width:100%;height:46px}
.err{color:var(--up);padding:20px;text-align:center}
footer{color:var(--mut);font-size:12px;text-align:center;padding:8px 16px}
details.sec>summary{list-style:none;cursor:pointer;color:var(--tx);font-size:inherit}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sec>summary .arw{color:var(--mut);font-size:13px;flex:none;transition:transform .2s}
details.sec[open]>summary .arw{transform:rotate(90deg)}
details.sec>summary .big{font-size:20px}
details.sec[open]>summary .big{font-size:26px}
.kl{font-size:12px;font-weight:600;color:var(--blue);border:1px solid var(--blue);border-radius:99px;padding:1px 8px;text-decoration:none}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools button,.tools a{flex:1;text-align:center;background:var(--card);color:var(--blue);border:1px solid var(--line);border-radius:10px;padding:7px;font-size:13px;cursor:pointer;text-decoration:none}
details.nw{border-top:1px solid var(--line);padding:6px 0}
details.nw>summary{color:var(--tx);font-weight:600;font-size:14px}
details.nw ul{list-style:none;margin:6px 0 0;padding:0}
details.nw li{padding:6px 0;border-bottom:1px dashed #22314f;font-size:14px;line-height:1.45}
details.nw li:last-child{border-bottom:0}
details.nw li a{color:var(--tx);text-decoration:none}
details.nw li span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>📊 盤前看板</h1><a href="chart.html" style="color:var(--blue);font-size:14px;text-decoration:none">📈 K線圖 →</a></div>
  <div class="sub" id="upd">載入中…</div>
</header>
<main id="app"></main>
<footer>資料：證交所、期交所、Yahoo Finance｜每天 07:20、17:05、21:45 自動更新｜僅供參考，非投資建議</footer>

<script>
const $ = s => document.querySelector(s);
const fmt = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const sg = (v, d = 0) => v == null ? '—' : (v > 0 ? '▲' : v < 0 ? '▼' : '') + fmt(Math.abs(v), d);
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'mut';
const md = d => d ? d.slice(5).replace('-', '/') : '';
const tag = (t, c) => `<span class="tag ${c}">${t}</span>`;

// 10 天長條圖（台股習慣：紅漲綠跌）
function bars(dates, vals, d = 0, unit = '') {
  const W = 340, H = 130, top = 16, bot = 30, n = dates.length, bw = W / n;
  const ok = vals.filter(v => v != null);
  if (!ok.length) return '<p class="note">尚無資料</p>';
  const mx = Math.max(...ok.map(Math.abs)) || 1, mid = top + (H - top - bot) / 2, half = (H - top - bot) / 2;
  let s = `<svg class="bars" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#26375a"/>`;
  vals.forEach((v, i) => {
    const x = i * bw + bw * 0.18, w = bw * 0.64;
    if (v != null) {
      const h = Math.max(1.5, Math.abs(v) / mx * half), y = v >= 0 ? mid - h : mid;
      const c = v > 0 ? '#ff5a5a' : v < 0 ? '#2ecc71' : '#93a3bf';
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${dates[i]}：${sg(v, d)}${unit}</title></rect>`;
      const ty = v >= 0 ? y - 3 : y + h + 10;
      s += `<text x="${x + w / 2}" y="${ty}" font-size="8.5" text-anchor="middle" fill="${c}">${fmt(v, d)}</text>`;
    }
    s += `<text x="${x + w / 2}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#93a3bf">${md(dates[i])}</text>`;
  });
  return s + '</svg>';
}
// 迷你K線（近 30 天，含 5MA／20MA），點了到詳細K線頁
function minik(item, h = 150, n = 30) {
  if (!item) return '<p class="note">K線資料準備中</p>';
  const all = item.bars, C = all.map(b => b[4]);
  const ma = k => C.map((_, i) => i + 1 < k ? null : C.slice(i + 1 - k, i + 1).reduce((a, b) => a + b, 0) / k);
  const m5 = ma(5).slice(-n), m20 = ma(20).slice(-n), B = all.slice(-n);
  const W = 340, R = 44, top = 8, bot = 18, cw = (W - R) / B.length;
  const vals = B.flatMap(b => [b[2], b[3]]).concat(m5, m20).filter(v => v != null);
  const mx = Math.max(...vals), mn = Math.min(...vals), y = v => top + (mx - v) / (mx - mn || 1) * (h - top - bot);
  const big = mx >= 1000, f = v => fmt(v, big ? 0 : 1);
  let s = `<a href="chart.html?s=${item.id}" style="display:block;text-decoration:none"><svg class="bars" viewBox="0 0 ${W} ${h}">`;
  [mx, (mx + mn) / 2, mn].forEach(v => s += `<line x1="0" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f2e4a"/><text x="${W - R + 3}" y="${y(v) + 3}" font-size="9" fill="#93a3bf">${f(v)}</text>`);
  B.forEach((b, i) => {
    const x = i * cw + cw / 2, up = b[4] >= b[1], c = up ? '#ff5a5a' : '#2ecc71';
    s += `<line x1="${x}" x2="${x}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${c}"/>`;
    const y1 = y(Math.max(b[1], b[4])), y2 = y(Math.min(b[1], b[4]));
    s += `<rect x="${x - cw * .35}" y="${y1}" width="${cw * .7}" height="${Math.max(1, y2 - y1)}" fill="${c}"/>`;
  });
  const path = arr => arr.map((v, i) => v == null ? '' : `${i * cw + cw / 2},${y(v)}`).filter(Boolean).join(' ');
  s += `<polyline points="${path(m5)}" fill="none" stroke="#f2b84b" stroke-width="1.2"/><polyline points="${path(m20)}" fill="none" stroke="#5aa9ff" stroke-width="1.2"/>`;
  [[0, 'start'], [Math.floor(B.length / 2), 'middle'], [B.length - 1, 'end']].forEach(([i, a]) => s += `<text x="${a === 'start' ? 0 : a === 'end' ? W - R : i * cw + cw / 2}" y="${h - 4}" font-size="9" text-anchor="${a}" fill="#93a3bf">${md(B[i][0])}</text>`);
  return s + `</svg><div class="note" style="display:flex;justify-content:space-between"><span><span style="color:#f2b84b">━ 5MA</span>　<span style="color:#5aa9ff">━ 20MA</span>　近 ${n} 天</span><span style="color:var(--blue)">點圖看 KD、MACD →</span></div></a>`;
}
function spark(vals) {
  const ok = vals.filter(v => v != null); if (ok.length < 2) return '';
  const W = 300, H = 40, mn = Math.min(...ok), mx = Math.max(...ok), r = mx - mn || 1;
  const pts = vals.map((v, i) => v == null ? null : `${(i / (vals.length - 1) * W).toFixed(1)},${(H - 4 - (v - mn) / r * (H - 8)).toFixed(1)}`).filter(Boolean);
  const c = ok.at(-1) >= ok[0] ? '#ff5a5a' : '#2ecc71';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2"/></svg>`;
}
function table(head, rows) {
  return `<details><summary>看 10 天明細</summary><div class="scroll"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.slice().reverse().map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
}
// 夜盤／美股的日期對齊：某交易日收盤「之後」的那一場
const after = (obj, d) => { const k = Object.keys(obj || {}).sort().find(x => x > d); return k ? { d: k, ...obj[k] } : null; };
const sameOrAfter = (obj, d) => { const k = Object.keys(obj || {}).sort().find(x => x >= d); return k ? { d: k, ...obj[k] } : null; };

async function main() {
  let J, KL = { items: [] };
  try { J = await (await fetch('pm/data.json?t=' + Date.now())).json(); }
  catch { $('#app').innerHTML = '<div class="err">資料還沒準備好，請稍後再試</div>'; return; }
  try { KL = await (await fetch('pm/kline.json?t=' + Date.now())).json(); } catch {}
  let NW = null; try { NW = await (await fetch('pm/news.json?t=' + Date.now())).json(); } catch {}
  const kItem = id => KL.items.find(x => x.id === id);
  const days = J.days, last = days.at(-1);
  $('#upd').textContent = `更新時間 ${J.updated}｜最近交易日 ${md(last)}`;

  // ---- 各項資料序列 ----
  const I = days.map(d => J.index[d] || {});
  const ix = I.at(-1);
  const N = days.map(d => after(J.night, d));               // 收盤後的夜盤
  const S = days.map(d => sameOrAfter(J.us.SOX, d));        // 當天美股（台灣隔天清晨收盤）
  const F = days.map(d => J.inst[d] || {});
  const T = days.map(d => J.fut[d] || {});
  const M = days.map(d => J.margin[d] || {});
  // 最新夜盤、費半：取最新一筆
  const lastOf = o => { const k = Object.keys(o || {}).sort().at(-1); return k ? { d: k, ...o[k] } : null; };
  const nL = lastOf(J.night), sL = lastOf(J.us.SOX);
  const fL = F.findLast(x => x.tot != null) || {}, tL = T.findLast(x => x.net != null) || {}, mL = M.findLast(x => x.finChg != null) || {};
  const mLd = days[M.findLastIndex(x => x.finChg != null)];

  // ---- 判斷 ----
  const above5 = ix.c >= ix.ma5, above20 = ix.c >= ix.ma20;
  const sig = {
    idx: above5 && above20 ? ['偏多', 'up'] : !above5 && !above20 ? ['偏空', 'dn'] : ['整理', 'mid'],
    night: nL ? (nL.ch > 0 ? ['開高', 'up'] : nL.ch < 0 ? ['開低', 'dn'] : ['平盤', 'mid']) : ['—', 'mid'],
    sox: sL ? (sL.p > 0 ? ['偏多', 'up'] : ['偏空', 'dn']) : ['—', 'mid'],
    inst: fL.tot > 0 ? ['買超', 'up'] : ['賣超', 'dn'],
    fut: tL.chg > 0 ? ['空單減', 'up'] : tL.chg < 0 ? ['空單增', 'dn'] : ['持平', 'mid'],
    mar: mL.finChg < 0 ? ['籌碼乾淨', 'up'] : ['散戶追價', 'dn'],
  };
  const chip3 = [sig.inst[1], sig.fut[1], sig.mar[1]];
  const agree = chip3.every(c => c === 'up') ? '<b>籌碼三項都偏多</b>，訊號較可靠' :
    chip3.every(c => c === 'dn') ? '<b>籌碼三項都偏空</b>，訊號較可靠' : '<b>籌碼三項方向不一致</b>，宜保守、多留現金';

  const tiles = [
    ['idx', '加權指數', fmt(ix.c), `<span class="${cls(ix.ch)}">${sg(ix.ch)}</span>`, sig.idx],
    ['night', `台指期夜盤 <small>${nL ? md(nL.d) + '盤前' : ''}</small>`, nL ? fmt(nL.c) : '—', nL ? `<span class="${cls(nL.ch)}">${sg(nL.ch)}</span>` : '', sig.night],
    ['sox', '費城半導體', sL ? fmt(sL.c, 0) : '—', sL ? `<span class="${cls(sL.p)}">${sg(sL.p, 2)}%</span>` : '', sig.sox],
    ['inst', `三大法人合計 <small>${md(days[F.findLastIndex(x => x.tot != null)])}</small>`, fL.tot != null ? sg(fL.tot, 0) + '億' : '—', `外資 <span class="${cls(fL.fi)}">${sg(fL.fi, 0)}</span>`, sig.inst],
    ['fut', '外資期貨淨未平倉', fmt(tL.net), `<span class="${cls(tL.chg)}">${sg(tL.chg)}口</span>`, sig.fut],
    ['mar', `融資增減 <small>${mLd ? md(mLd) : ''}</small>`, mL.finChg != null ? sg(mL.finChg, 1) + '億' : '—', `融券 <span class="${cls(mL.shtChg)}">${sg(mL.shtChg)}張</span>`, sig.mar],
  ];
  let h = `<div class="grid">${tiles.map(([id, k, v, s, g]) => `<a class="tile" href="#${id}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s} ${tag(g[0], g[1])}</div></a>`).join('')}</div>`;
  h += `<div class="sum">📌 ${agree}<br><span class="mut">盤勢位置：</span>${above5 ? '站上' : '跌破'}5均（${fmt(ix.ma5)}），${above20 ? '站上' : '跌破'}月線（${fmt(ix.ma20)}）</div>`;

  // 1. 指數
  h += `<section id="idx"><h2>① 加權指數 ${tag(sig.idx[0], sig.idx[1])} <a class="kl" href="chart.html?s=TWII">K線</a></h2>
    <div class="big">${fmt(ix.c, 2)}<small class="${cls(ix.ch)}">${sg(ix.ch, 2)}（${sg(ix.p, 2)}%）</small></div>
    <div class="chips"><span class="chip">5均 ${fmt(ix.ma5)}（差 <span class="${cls(ix.c - ix.ma5)}">${sg(ix.c - ix.ma5)}</span>）</span>
    <span class="chip">月線 ${fmt(ix.ma20)}（差 <span class="${cls(ix.c - ix.ma20)}">${sg(ix.c - ix.ma20)}</span>）</span>
    <span class="chip">成交 ${fmt(ix.amt / 1e4, 2)} 兆</span></div>
    ${minik(kItem('TWII'))}
    ${table(['日期', '收盤', '漲跌', '5均', '月線', '成交(億)'], days.map((d, i) => [md(d), fmt(I[i].c), `<span class="${cls(I[i].ch)}">${sg(I[i].ch)}</span>`, fmt(I[i].ma5), fmt(I[i].ma20), fmt(I[i].amt)]))}
    <div class="how"><b>怎麼看：</b>大跌但沒破5均＝正常拉回；跌破5均＝開始等第二隻腳。月線下彎時，指數靠近月線就是壓力，不追高。</div></section>`;

  // 2. 夜盤
  h += `<section id="night"><h2>② 台指期夜盤 ${tag(sig.night[0], sig.night[1])} <a class="kl" href="chart.html?s=TXN">K線</a></h2>
    ${nL ? `<div class="big">${fmt(nL.c)}<small class="${cls(nL.ch)}">${sg(nL.ch)}（${sg(nL.p, 2)}%）</small></div><p class="note">${md(nL.d)} 盤前參考（${nL.m} 合約）</p>` : '<p class="note">尚無資料</p>'}
    ${minik(kItem('TXN'))}
    ${table(['盤前日', '夜盤收', '漲跌', '%'], N.map((x, i) => [md(x?.d || days[i]), fmt(x?.c), `<span class="${cls(x?.ch)}">${sg(x?.ch)}</span>`, sg(x?.p, 2)]))}
    <div class="how"><b>怎麼看：</b>最直接預告今天開高或開低。夜盤大漲要防開高走低；遇到突發利空，看夜盤最後收在哪裡，急殺後拉回＝利空可能已提前反應。</div></section>`;

  // 3. 美股
  const usL = k => lastOf(J.us[k]);
  h += `<section id="sox"><h2>③ 費城半導體 ${tag(sig.sox[0], sig.sox[1])} <a class="kl" href="chart.html?s=SOX">K線</a></h2>
    ${sL ? `<div class="big">${fmt(sL.c, 2)}<small class="${cls(sL.p)}">${sg(sL.p, 2)}%</small></div><p class="note">美國 ${md(sL.d)} 收盤</p>` : '<p class="note">尚無資料</p>'}
    <div class="chips">${[['DJI', '道瓊'], ['IXIC', '那斯達克'], ['GSPC', 'S&P500']].map(([k, n]) => { const x = usL(k); return `<span class="chip">${n} <span class="${cls(x?.p)}">${sg(x?.p, 2)}%</span></span>`; }).join('')}</div>
    ${minik(kItem('SOX'))}
    ${table(['美股日', '費半', '漲跌%'], S.map((x, i) => [md(x?.d || days[i]), fmt(x?.c, 2), `<span class="${cls(x?.p)}">${sg(x?.p, 2)}</span>`]))}
    <div class="how"><b>怎麼看：</b>費半和台積電、台股連動最強。注意是「反彈後又跌」（趨勢偏弱）還是「止穩」；長下影線代表低檔有買盤。</div></section>`;

  // 4. 法人
  h += `<section id="inst"><h2>④ 三大法人現貨買賣超 ${tag(sig.inst[0], sig.inst[1])}</h2>
    <div class="big ${cls(fL.tot)}">${sg(fL.tot, 1)} 億</div>
    <div class="chips"><span class="chip">外資 <span class="${cls(fL.fi)}">${sg(fL.fi, 1)}</span></span><span class="chip">投信 <span class="${cls(fL.it)}">${sg(fL.it, 1)}</span></span><span class="chip">自營商 <span class="${cls(fL.dl)}">${sg(fL.dl, 1)}</span></span></div>
    ${bars(days, F.map(x => x.tot ?? null), 0, '億')}
    ${table(['日期', '外資', '投信', '自營商', '合計'], days.map((d, i) => [md(d), ...['fi', 'it', 'dl', 'tot'].map(k => `<span class="${cls(F[i][k])}">${sg(F[i][k], 1)}</span>`)]))}
    <div class="how"><b>怎麼看：</b>外資由賣轉買是好訊號；大跌日法人仍合計買超＝底層籌碼不壞；投信連續大買＝下檔有支撐。單日雜訊大，要看連續幾天的方向。</div></section>`;

  // 5. 期貨
  h += `<section id="fut"><h2>⑤ 外資台指期淨未平倉 ${tag(sig.fut[0], sig.fut[1])}</h2>
    <div class="big ${cls(tL.net)}">${fmt(tL.net)} 口<small class="${cls(tL.chg)}">${sg(tL.chg)}</small></div>
    <p class="note">負數＝淨空單；「增減」為正代表空單減少</p>
    ${bars(days, T.map(x => x.chg ?? null), 0, '口')}
    ${table(['日期', '淨未平倉', '增減'], days.map((d, i) => [md(d), fmt(T[i].net), `<span class="${cls(T[i].chg)}">${sg(T[i].chg)}</span>`]))}
    <div class="how"><b>怎麼看：</b>空單大減、跌破 10 萬口＝壓力退潮；10 萬口以上＝高檔仍有壓盤工具。現貨買、期貨空單卻增加＝訊號矛盾。結算日前後數字容易失真。</div></section>`;

  // 6. 融資融券
  h += `<section id="mar"><h2>⑥ 融資融券 ${tag(sig.mar[0], sig.mar[1])}</h2>
    <div class="big">融資 <span class="${cls(mL.finChg)}">${sg(mL.finChg, 1)} 億</span></div>
    <div class="chips"><span class="chip">融資餘額 ${fmt(mL.fin, 0)} 億</span><span class="chip">融券 <span class="${cls(mL.shtChg)}">${sg(mL.shtChg)}</span> 張</span><span class="chip">融券餘額 ${fmt(mL.sht)} 張</span></div>
    <p class="note">${mLd ? md(mLd) + ' 資料（融資券約晚上 9 點後公布）' : ''}</p>
    <p class="note" style="margin-top:8px">融資增減（億）</p>${bars(days, M.map(x => x.finChg ?? null), 1, '億')}
    <p class="note">融券增減（張）</p>${bars(days, M.map(x => x.shtChg ?? null), 0, '張')}
    ${table(['日期', '融資增減', '融資餘額', '融券增減', '融券餘額'], days.map((d, i) => [md(d), `<span class="${cls(M[i].finChg)}">${sg(M[i].finChg, 1)}</span>`, fmt(M[i].fin), `<span class="${cls(M[i].shtChg)}">${sg(M[i].shtChg)}</span>`, fmt(M[i].sht)]))}
    <div class="how"><b>怎麼看：</b>融資減＝散戶被洗出場、籌碼變乾淨；融資大增＝散戶追價。融券增加＝未來的軋空燃料；融券大減（回補）＝反彈有軋空推力。</div></section>`;

  // 7. 權值股
  if (J.top5?.list?.length) {
    h += `<section id="top5"><h2>⭐ 權值股前五名</h2><div class="big" style="font-size:15px">${J.top5.list.map(s => s.name).join('、')}</div><p class="note">依市值排名，權重為占上市總市值比例（約略值）；K線為近 20 天，點圖看 KD、MACD</p>`;
    J.top5.list.forEach((s, k) => {
      const hs = days.map(d => s.hist[d] || {}), x = hs.findLast(v => v.c != null) || {}, fi = hs.at(-1)?.fi;
      h += `<div class="stock"><div><a class="n" style="color:inherit;text-decoration:none" href="chart.html?s=${s.code}">${k + 1}. ${s.name} <span class="kl">K線</span></a> <span class="w">${s.code}｜權重 ${fmt(s.w, 1)}%</span><div class="w">外資 <span class="${cls(fi)}">${sg(fi)}</span> 張</div></div>
        <div class="px">${fmt(x.c, 1)}<div class="${cls(x.ch)}" style="font-size:13px">${sg(x.ch, 1)}（${sg(x.p, 2)}%）</div></div>
        <div style="grid-column:1/3">${minik(kItem(s.code), 110, 20)}</div>
        </div>`;
    });
    h += table(['日期', ...J.top5.list.map(s => s.name)], days.map(d => [md(d), ...J.top5.list.map(s => { const v = s.hist[d] || {}; return `${fmt(v.c, 1)}<br><span class="${cls(v.ch)}">${sg(v.p, 2)}%</span>`; })]));
    h += `<div class="how"><b>怎麼看：</b>權值股決定大盤方向，特別盯台積電有沒有撐盤或回檔。</div></section>`;
  }
  // 8. 國際重大經濟新聞
  if (NW?.topics?.length) {
    const ago = t => { const m = (Date.now() - t) / 6e4; return !t ? '' : m < 60 ? Math.round(m) + ' 分鐘前' : m < 1440 ? Math.round(m / 60) + ' 小時前' : Math.round(m / 1440) + ' 天前'; };
    const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const total = NW.topics.reduce((n, t) => n + t.items.length, 0);
    h += `<section id="news"><h2>🌍 國際重大經濟新聞</h2><div class="big" style="font-size:15px">${NW.topics.map(t => t.name.split(' ')[1]).join('・')}</div>
      <p class="note">近 2 天｜共 ${total} 則｜更新 ${NW.updated}</p>
      ${NW.topics.map(t => `<details class="nw"><summary>${t.name}（${t.items.length}）</summary><ul>${t.items.map(x => `<li><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a><span>${esc(x.s)}　${ago(x.time)}</span></li>`).join('') || '<li class="mut">目前沒有新聞</li>'}</ul></details>`).join('')}
      <div class="how"><b>怎麼看：</b>新聞當背景參考，不當進出主因；看完新聞，再回頭確認夜盤、費半有沒有反應。利空出現但夜盤急殺後拉回＝可能已提前反應。</div></section>`;
  }
  $('#app').innerHTML = `<div class="tools"><button id="openAll">全部展開</button><button id="closeAll">全部收合</button></div>` + h;
  // 每一區改成可收合（預設收合，只顯示標題＋最新數字）
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('pm-open') || '{}'); } catch {}
  const save = () => { try { localStorage.setItem('pm-open', JSON.stringify(saved)); } catch {} };
  document.querySelectorAll('#app section').forEach(sec => {
    const d = document.createElement('details'); d.className = 'sec'; d.id = sec.id;
    const sum = document.createElement('summary'), row = document.createElement('div'); row.className = 'row';
    const left = document.createElement('div'), arw = document.createElement('span'); arw.className = 'arw'; arw.textContent = '▶';
    const h2 = sec.querySelector('h2'), big = sec.querySelector(':scope > .big');
    left.append(h2); if (big) left.append(big);
    row.append(left, arw); sum.append(row); d.append(sum);
    while (sec.firstChild) d.append(sec.firstChild);
    d.open = !!saved[d.id];
    d.addEventListener('toggle', () => { saved[d.id] = d.open; save(); });
    sec.replaceWith(d);
  });
  sumLinks();
  $('#openAll').onclick = () => document.querySelectorAll('details.sec').forEach(d => d.open = true);
  $('#closeAll').onclick = () => document.querySelectorAll('details.sec').forEach(d => d.open = false);
  document.querySelectorAll('a.tile').forEach(a => a.addEventListener('click', () => { const d = document.querySelector(a.getAttribute('href')); if (d) d.open = true; }));
}
// 標題裡的 K線連結：點了直接開圖，不觸發收合
function sumLinks() { document.querySelectorAll('summary a').forEach(a => a.addEventListener('click', e => e.stopPropagation())); }
main();
</script>
</body>
</html>
