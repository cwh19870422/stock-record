<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盤前看板</title>
<meta name="theme-color" content="#0f1a2e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0f1a2e;--card:#17243d;--line:#26375a;--tx:#e8eef8;--mut:#93a3bf;--up:#ff5a5a;--dn:#2ecc71;--acc:#f2b84b;--blue:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:0 0 40px}
header{position:sticky;top:0;z-index:5;background:rgba(15,26,46,.95);backdrop-filter:blur(6px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:12px}
main{max-width:760px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:inherit;display:block}
.tile .k{font-size:12px;color:var(--mut)}
.tile .v{font-size:19px;font-weight:700;margin:2px 0}
.tile .s{font-size:12px}
.sum{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.sum b{color:var(--acc)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;scroll-margin-top:70px}
details.sec h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}
.tag.up{color:var(--up);border-color:var(--up)} .tag.dn{color:var(--dn);border-color:var(--dn)} .tag.mid{color:var(--mut);border-color:var(--mut)}
.big{font-size:26px;font-weight:800;margin:4px 0 0}
.big small{font-size:15px;font-weight:600;margin-left:8px}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.how{font-size:13px;background:#0f1a2e;border-radius:8px;padding:8px 10px;margin-top:10px;color:#c9d5ea}
.how b{color:var(--acc)}
svg.bars{width:100%;height:auto;display:block;margin-top:10px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--blue);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#0f1a2e;border-radius:8px;padding:4px 8px;font-size:12px}
.stock{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.stock:last-child{border-bottom:0}
.stock .n{font-weight:700}
.stock .w{font-size:12px;color:var(--mut)}
.stock .px{text-align:right;font-weight:700}
.stock>svg{grid-column:1/3;width:100%;height:46px}
.err{color:var(--up);padding:20px;text-align:center}
footer{color:var(--mut);font-size:12px;text-align:center;padding:8px 16px}
details.sec>summary{list-style:none;cursor:pointer;color:var(--tx);font-size:inherit}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sec>summary .arw{color:var(--mut);font-size:13px;flex:none;transition:transform .2s}
details.sec[open]>summary .arw{transform:rotate(90deg)}
details.sec>summary .big{font-size:20px}
details.sec[open]>summary .big{font-size:26px}
.kl{font-size:12px;font-weight:600;color:var(--blue);border:1px solid var(--blue);border-radius:99px;padding:1px 8px;text-decoration:none}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools button,.tools a{flex:1;text-align:center;background:var(--card);color:var(--blue);border:1px solid var(--line);border-radius:10px;padding:7px;font-size:13px;cursor:pointer;text-decoration:none}
details.nw{border-top:1px solid var(--line);padding:6px 0}
details.nw>summary{color:var(--tx);font-weight:600;font-size:14px}
details.nw ul{list-style:none;margin:6px 0 0;padding:0}
details.nw li{padding:6px 0;border-bottom:1px dashed #22314f;font-size:14px;line-height:1.45}
details.nw li:last-child{border-bottom:0}
details.nw li a{color:var(--tx);text-decoration:none}
details.nw li span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
#sector .seg{display:flex;gap:6px;margin:8px 0}
#sector .seg button{flex:1;background:#0f1a2e;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:14px;cursor:pointer}
#sector .seg button.on{background:#26375a;color:var(--tx);font-weight:700;border-color:#3DA5FF}
.tm{position:relative;width:100%;aspect-ratio:10/11;container-type:inline-size;border-radius:10px;overflow:hidden;background:#0f1a2e}
.tm div{position:absolute;box-sizing:border-box;border:1.5px solid #0f1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden;cursor:pointer;line-height:1.25;padding:2px}
.tm div b{font-weight:800} .tm div.sel{outline:2px solid #F0E442;outline-offset:-3px;z-index:2}
.tmlist{margin-top:10px} .tmlist a{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:14px}
.tmlist a span:last-child{font-variant-numeric:tabular-nums}
.share header a,.share .kl,.share #sector .tmlist a span.mut{display:none!important}
.share a[href^="chart.html"]{pointer-events:none}
.share a[href^="chart.html"] .note span[style*="var(--blue)"]{display:none}
details.dd{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
details.dd>summary{color:var(--blue);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>📊 盤前看板</h1><span><a href="watch.html" style="color:var(--blue);font-size:14px;text-decoration:none">⭐ 自選</a>　<a href="chart.html" style="color:var(--blue);font-size:14px;text-decoration:none">📈 K線圖</a></span></div>
  <div class="sub"><span id="upd">載入中…</span> <span id="live"></span></div>
</header>
<main id="app"></main>
<footer>資料：證交所、期交所、Yahoo Finance｜每天 07:20、17:05、21:45 自動更新｜僅供參考，非投資建議</footer>

<script>if (new URLSearchParams(location.search).has('share')) document.documentElement.classList.add('share');</script>
<script src="pm/embed.js"></script>
<script src="pm/rt.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const sg = (v, d = 0) => v == null ? '—' : (v > 0 ? '▲' : v < 0 ? '▼' : '') + fmt(Math.abs(v), d);
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'mut';
const md = d => d ? d.slice(5).replace('-', '/') : '';
const tag = (t, c) => `<span class="tag ${c}">${t}</span>`;

// 10 天長條圖（台股習慣：紅漲綠跌）
function bars(dates, vals, d = 0, unit = '') {
  const W = 340, H = 130, top = 16, bot = 30, n = dates.length, bw = W / n;
  const ok = vals.filter(v => v != null);
  if (!ok.length) return '<p class="note">尚無資料</p>';
  const mx = Math.max(...ok.map(Math.abs)) || 1, mid = top + (H - top - bot) / 2, half = (H - top - bot) / 2;
  let s = `<svg class="bars" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#26375a"/>`;
  vals.forEach((v, i) => {
    const x = i * bw + bw * 0.18, w = bw * 0.64;
    if (v != null) {
      const h = Math.max(1.5, Math.abs(v) / mx * half), y = v >= 0 ? mid - h : mid;
      const c = v > 0 ? '#ff5a5a' : v < 0 ? '#2ecc71' : '#93a3bf';
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}"><title>${dates[i]}：${sg(v, d)}${unit}</title></rect>`;
      const ty = v >= 0 ? y - 3 : y + h + 10;
      s += `<text x="${x + w / 2}" y="${ty}" font-size="8.5" text-anchor="middle" fill="${c}">${fmt(v, d)}</text>`;
    }
    s += `<text x="${x + w / 2}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#93a3bf">${md(dates[i])}</text>`;
  });
  return s + '</svg>';
}
// 迷你K線（近 30 天，含 5MA／20MA），點了到詳細K線頁
// 美股開盤時間（自動判斷美國夏令／冬令時間）
function usHours() {
  const ny = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', timeZoneName: 'short' }).formatToParts(new Date()).find(x => x.type === 'timeZoneName')?.value;
  const dst = ny === 'EDT';
  return `目前是<b>${dst ? '夏令' : '冬令'}時間</b>：${dst ? '21:30 ～ 隔天 04:00' : '22:30 ～ 隔天 05:00'}<br><span class="mut">夏令（3 月第二個週日～11 月第一個週日）21:30～04:00；冬令 22:30～05:00</span>`;
}
// 均線配色：色弱友善（黃／白／天藍／粉紫虛線），顏色＋線型雙重區分
const MAS = [{ k: 5, c: '#F0E442', w: 1.6 }, { k: 10, c: '#FFFFFF', w: 1.1 }, { k: 20, c: '#3DA5FF', w: 2 }, { k: 60, c: '#CC79A7', w: 1.6, dash: true }];
// 迷你K線（含成交量、5／10／20／60MA），點了到詳細K線頁
function minik(item, h = 190, n = 30, opt = {}) {
  if (!item) return '<p class="note">K線資料準備中</p>';
  const all = item.bars, C = all.map(b => b[4]);
  const ma = k => C.map((_, i) => i + 1 < k ? null : C.slice(i + 1 - k, i + 1).reduce((a, b) => a + b, 0) / k).slice(-n);
  const MA = MAS.filter(m => (opt.ma || [5, 10, 20, 60]).includes(m.k)).map(m => ({ ...m, v: ma(m.k) }));
  const B = all.slice(-n), hasVol = opt.vol !== false && B.some(b => b[5] > 0);
  const W = 340, R = 44, top = 8, bot = 16, volH = hasVol ? (h - top - bot) * 0.22 : 0, pH = h - top - bot - volH - (hasVol ? 4 : 0), cw = (W - R) / B.length;
  const vals = B.flatMap(b => [b[2], b[3]]).concat(...MA.map(m => m.v)).filter(v => v != null);
  const mx = Math.max(...vals), mn = Math.min(...vals), y = v => top + (mx - v) / (mx - mn || 1) * pH;
  const vMax = Math.max(...B.map(b => b[5])) || 1, vBase = h - bot;
  const big = mx >= 1000, f = v => fmt(v, big ? 0 : 1);
  let s = `<a href="chart.html?s=${item.id}" style="display:block;text-decoration:none"><svg class="bars" viewBox="0 0 ${W} ${h}">`;
  [mx, (mx + mn) / 2, mn].forEach(v => s += `<line x1="0" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f2e4a"/><text x="${W - R + 3}" y="${y(v) + 3}" font-size="9" fill="#93a3bf">${f(v)}</text>`);
  B.forEach((b, i) => {
    const x = i * cw + cw / 2, up = b[4] >= b[1], c = up ? '#ff5a5a' : '#2ecc71';
    s += `<line x1="${x}" x2="${x}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${c}"/>`;
    const y1 = y(Math.max(b[1], b[4])), y2 = y(Math.min(b[1], b[4]));
    s += `<rect x="${x - cw * .35}" y="${y1}" width="${cw * .7}" height="${Math.max(1, y2 - y1)}" fill="${c}"/>`;
    if (hasVol) { const vh = b[5] / vMax * volH; s += `<rect x="${x - cw * .35}" y="${vBase - vh}" width="${cw * .7}" height="${vh}" fill="${c}" opacity=".45"/>`; }
  });
  if (hasVol) s += `<text x="${W - R + 3}" y="${vBase - volH + 8}" font-size="9" fill="#93a3bf">量</text>`;
  const path = arr => arr.map((v, i) => v == null ? '' : `${i * cw + cw / 2},${y(v)}`).filter(Boolean).join(' ');
  MA.forEach(m => s += `<polyline points="${path(m.v)}" fill="none" stroke="${m.c}" stroke-width="${m.w}"${m.dash ? ' stroke-dasharray="4 3"' : ''}/>`);
  [[0, 'start'], [Math.floor(B.length / 2), 'middle'], [B.length - 1, 'end']].forEach(([i, a]) => s += `<text x="${a === 'start' ? 0 : a === 'end' ? W - R : i * cw + cw / 2}" y="${h - 3}" font-size="9" text-anchor="${a}" fill="#93a3bf">${md(B[i][0])}</text>`);
  return s + `</svg><div class="note" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><span>${MA.map(m => `<span style="color:${m.c}">${m.dash ? '┅' : '━'}${m.k}MA</span>`).join(' ')}　近 ${n} 天</span><span style="color:var(--blue)">點圖看 KD、MACD →</span></div></a>`;
}
// 總量折線：每天標出總量，下方一排是當天增減
function level(dates, vals, chg, fv, fc, o = {}) {
  const W = 340, L = 8, R = 8, n = dates.length, cw = (W - L - R) / n, top = 30, ph = 70;
  const ok = vals.filter(v => v != null);
  if (!ok.length) return '<p class="note">尚無資料</p>';
  const all = o.ref != null ? ok.concat(o.ref) : ok, mx = Math.max(...all), mn = Math.min(...all), pad = (mx - mn) * .12 || 1;
  const y = v => top + (mx + pad - v) / (mx - mn + pad * 2) * ph, x = i => L + i * cw + cw / 2;
  let s = `<p class="note" style="margin:10px 0 0">${o.title}</p><svg class="bars" style="margin-top:2px" viewBox="0 0 ${W} ${top + ph + 40}">`;
  if (o.ref != null) s += `<line x1="0" x2="${W}" y1="${y(o.ref)}" y2="${y(o.ref)}" stroke="#F0E442" stroke-dasharray="4 3" stroke-opacity=".7"/><text x="2" y="${y(o.ref) + 11}" font-size="9" fill="#F0E442">${o.refLabel}</text>`;
  const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
  s += `<polygon points="${pts[0][0]},${top + ph} ${pts.map(p => p.join(',')).join(' ')} ${pts.at(-1)[0]},${top + ph}" fill="#3DA5FF" fill-opacity=".12"/>`;
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#3DA5FF" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v, i) => {
    if (v == null) return;
    const last = i === n - 1;
    s += `<circle cx="${x(i)}" cy="${y(v)}" r="${last ? 4 : 2.6}" fill="#3DA5FF" stroke="#17243d" stroke-width="1.5"/>`;
    s += `<text x="${x(i)}" y="${y(v) - 8}" font-size="${last ? 9.5 : 8.5}" font-weight="${last ? 700 : 400}" text-anchor="middle" fill="${last ? '#e8eef8' : '#c9d5ea'}">${fv(v)}</text>`;
    const c = chg[i];
    if (c != null) s += `<text x="${x(i)}" y="${top + ph + 16}" font-size="8.5" text-anchor="middle" fill="${c > 0 ? '#ff5a5a' : c < 0 ? '#2ecc71' : '#93a3bf'}">${fc(c)}</text>`;
    s += `<text x="${x(i)}" y="${top + ph + 32}" font-size="9" text-anchor="middle" fill="#93a3bf">${md(dates[i])}</text>`;
  });
  s += `<text x="0" y="${top + ph + 16}" font-size="8" fill="#93a3bf" opacity="0">${o.chgTitle}</text>`;
  return s + `</svg>`;
}
// 分開小圖：每個項目一排、各自比例尺；實心＝買超、淡色＝賣超
function multi(dates, rows, unit = '') {
  const W = 340, L = 46, n = dates.length, cw = (W - L) / n, rh = 78;
  let s = `<svg class="bars" viewBox="0 0 ${W} ${rows.length * rh + 18}">`;
  rows.forEach(([name, vals, c], j) => {
    const y0 = j * rh, ok = vals.filter(v => v != null), pos = Math.max(0, ...ok), neg = Math.max(0, ...ok.map(v => -v)), k = (rh - 30) / ((pos + neg) || 1), mid = y0 + 14 + pos * k;
    s += `<text x="0" y="${mid + 4}" font-size="12" font-weight="600" fill="${c}">${name}</text>`;
    s += `<line x1="${L}" x2="${W}" y1="${mid}" y2="${mid}" stroke="#26375a"/>`;
    vals.forEach((v, i) => {
      if (v == null) return;
      const h = Math.max(1.5, Math.abs(v) * k), x = L + i * cw + cw * .18, w = cw * .64, buy = v >= 0;
      s += `<rect x="${x}" y="${buy ? mid - h : mid}" width="${w}" height="${h}" rx="2" fill="${c}" fill-opacity="${buy ? 1 : .4}" stroke="${c}" stroke-width="${buy ? 0 : 1}"><title>${name} ${dates[i]}：${sg(v, 1)}${unit}</title></rect>`;
      s += `<text x="${x + w / 2}" y="${buy ? mid - h - 3 : mid + h + 10}" font-size="8.5" text-anchor="middle" fill="${i === n - 1 ? '#e8eef8' : '#93a3bf'}">${fmt(v, 0)}</text>`;
    });
  });
  s += `<line x1="0" x2="${W}" y1="${rows.length * rh}" y2="${rows.length * rh}" stroke="#26375a"/>` + dates.map((d, i) => `<text x="${L + i * cw + cw / 2}" y="${rows.length * rh + 12}" font-size="9" text-anchor="middle" fill="#93a3bf">${md(d)}</text>`).join('');
  return s + `</svg><p class="note">實心＝買超、淡色框＝賣超｜每排各自比例，單位：${unit}</p>`;
}
function spark(vals) {
  const ok = vals.filter(v => v != null); if (ok.length < 2) return '';
  const W = 300, H = 40, mn = Math.min(...ok), mx = Math.max(...ok), r = mx - mn || 1;
  const pts = vals.map((v, i) => v == null ? null : `${(i / (vals.length - 1) * W).toFixed(1)},${(H - 4 - (v - mn) / r * (H - 8)).toFixed(1)}`).filter(Boolean);
  const c = ok.at(-1) >= ok[0] ? '#ff5a5a' : '#2ecc71';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2"/></svg>`;
}
function table(head, rows) {
  return `<details><summary>看 10 天明細</summary><div class="scroll"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.slice().reverse().map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
}
// 夜盤／美股的日期對齊：某交易日收盤「之後」的那一場
const after = (obj, d) => { const k = Object.keys(obj || {}).sort().find(x => x > d); return k ? { d: k, ...obj[k] } : null; };
const sameOrAfter = (obj, d) => { const k = Object.keys(obj || {}).sort().find(x => x >= d); return k ? { d: k, ...obj[k] } : null; };

async function main() {
  let J, KL = { items: [] };
  try { J = await (await fetch('pm/data.json?t=' + Date.now())).json(); }
  catch { $('#app').innerHTML = '<div class="err">資料還沒準備好，請稍後再試</div>'; return; }
  try { KL = await (await fetch('pm/kline.json?t=' + Date.now())).json(); } catch {}
  let NW = null; try { NW = await (await fetch('pm/news.json?t=' + Date.now())).json(); } catch {}
  let SC = null; try { SC = await (await fetch('pm/sector.json?t=' + Date.now())).json(); } catch {}
  const kItem = id => KL.items.find(x => x.id === id);
  const days = J.days, last = days.at(-1);
  $('#upd').textContent = `更新時間 ${J.updated}｜最近交易日 ${md(last)}`;

  // ---- 各項資料序列 ----
  const I = days.map(d => J.index[d] || {});
  const ix = I.at(-1);
  const N = days.map(d => after(J.night, d));               // 收盤後的夜盤
  const S = days.map(d => sameOrAfter(J.us.SOX, d));        // 當天美股（台灣隔天清晨收盤）
  const F = days.map(d => J.inst[d] || {});
  const T = days.map(d => J.fut[d] || {});
  const M = days.map(d => J.margin[d] || {});
  // 最新夜盤、費半：取最新一筆
  const lastOf = o => { const k = Object.keys(o || {}).sort().at(-1); return k ? { d: k, ...o[k] } : null; };
  // 美股漲跌點數＝今天收盤－前一天收盤

// ---- 產業熱力圖（squarified treemap，以百分比定位）----
function squarify(items, x, y, w, h, out = []) {
  if (!items.length) return out;
  const total = items.reduce((s, i) => s + i.a, 0);
  if (items.length === 1) { out.push({ ...items[0], x, y, w, h }); return out; }
  const side = Math.min(w, h), worst = (row, sum) => { const mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a)), s2 = sum * sum, l2 = side * side; return Math.max(l2 * mx / s2, s2 / (l2 * mn)); };
  let row = [items[0]], sum = items[0].a, i = 1;
  for (; i < items.length; i++) { const nr = row.concat(items[i]), ns = sum + items[i].a; if (worst(nr, ns) > worst(row, sum)) break; row = nr; sum = ns; }
  const frac = sum / total;
  if (w >= h) { const rw = w * frac; let cy = y; row.forEach(r => { const rh = h * r.a / sum; out.push({ ...r, x, y: cy, w: rw, h: rh }); cy += rh; }); return squarify(items.slice(i), x + rw, y, w - rw, h, out); }
  const rh = h * frac; let cx = x; row.forEach(r => { const rw2 = w * r.a / sum; out.push({ ...r, x: cx, y, w: rw2, h: rh }); cx += rw2; }); return squarify(items.slice(i), x, y + rh, w, h - rh, out);
}

}

    $('#tm').onclick = e => { const d = e.target.closest('[data-i]'); if (!d) return; const r = rects[+d.dataset.i]; sel = sel === r.name ? null : r.name; draw(); };
    const g = arr.find(x => x.name === sel);
    $('#tmlist').innerHTML = g ? `<p class="note"><b style="color:var(--tx)">${g.name}</b>　${g.n} 檔｜成交值 ${fmt(g.val)} 億｜<span class="${cls(g.pct)}">${sg(g.pct, 2)}%</span>（市值加權）</p>` +
      g.top.map(t => `<a href="chart.html?s=${t[0]}"><span>${t[1]} <span class="mut" style="font-size:12px">${t[0]}</span></span><span>${fmt(t[2], 1)}億　<span class="${cls(t[3])}">${sg(t[3], 2)}%</span></span></a>`).join('') : '';
  };
  const seg = (id, f) => $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); f(b.dataset.v); sel = null; draw(); };
  seg('#scM', v => mk = v); seg('#scP', v => per = v);
  draw(); sectorRedraw = draw;
}
// 標題裡的 K線連結：點了直接開圖，不觸發收合
function sumLinks() { document.querySelectorAll('summary a').forEach(a => a.addEventListener('click', e => e.stopPropagation())); }
// ---- 均線扣抵：扣抵值＝N 天前的收盤；今天收高於扣抵值，均線就往上 ----
function drawDed(live, isLive) {
  const D = window.__DEDC; if (!D || D.length < 30 || !$('#dedKeys')) return;
  const d = D.map(x => x[0]), c = D.map(x => x[1]), n = c.length, P = live ?? c[n - 1];
  const f = v => fmt(Math.round(v)), pct = v => (v / P * 100).toFixed(1);
  // 5均、月線差距（盤中用即時價）
  const X = window.__IX;
  $('#idxChips').innerHTML = `<span class="chip">5均 ${fmt(X.ma5)}（差 <span class="${cls(P - X.ma5)}">${sg(P - X.ma5)}</span>）</span>
    <span class="chip">月線 ${fmt(X.ma20)}（差 <span class="${cls(P - X.ma20)}">${sg(P - X.ma20)}</span>）</span>${isLive ? '' : `<span class="chip">成交 ${fmt(X.amt / 1e4, 2)} 兆</span>`}`;
  const R = [[5, '5均'], [20, '月線']].map(([N, name]) => {
    const ma = c.slice(n - N).reduce((a, b) => a + b, 0) / N, prev = c.slice(n - N - 1, n - 1).reduce((a, b) => a + b, 0) / N;
    const stand = c.slice(n - N + 1).reduce((a, b) => a + b, 0) / (N - 1);
    const ded = [0, 1, 2, 3, 4].map(i => [d[n - N + i], c[n - N + i]]);
    const lowIdx = ded.findIndex(x => x[1] < P);
    let note;
    if (lowIdx === -1) note = `未來 5 天扣抵都高於現價（${f(Math.min(...ded.map(x => x[1])))}～${f(Math.max(...ded.map(x => x[1])))}），${name}會持續下彎`;
    else if (lowIdx === 0) note = `${isLive ? '今天' : '下一個交易日'}扣抵 ${f(ded[0][1])} 低於現價，只要守住，${name}就會往上`;
    else note = `前 ${lowIdx} 天扣抵高於現價，${name}續彎；第 ${lowIdx + 1} 天扣 ${md(ded[lowIdx][0])} 的 ${f(ded[lowIdx][1])}，是最快有機會翻揚的一天`;
    return { name, ma, down: ma < prev, stand, ded, note };
  });
  const r5 = R[0], gap1 = r5.stand - P, gap2 = r5.ded[0][1] - P;
  $('#dedKeys').innerHTML = `<div class="grid" style="grid-template-rows:auto;grid-auto-flow:row;margin:10px 0 4px">
      <div class="tile"><div class="k">今天要站上 5均，需收在</div><div class="v" style="color:#F0E442">${f(r5.stand)} 以上</div><div class="s mut">${gap1 > 0 ? `還差 ▲${f(gap1)}（${pct(gap1)}%）` : '<span class="up">目前已站上</span>'}</div></div>
      <div class="tile"><div class="k">5均要止跌翻揚，需收在</div><div class="v" style="color:#F0E442">${f(r5.ded[0][1])} 以上</div><div class="s mut">${gap2 > 0 ? `還差 ▲${f(gap2)}（${pct(gap2)}%）` : '<span class="up">目前已高於扣抵</span>'}</div></div>
    </div><p class="note" style="margin:0">以${isLive ? '盤中即時' : ' ' + md(d[n - 1]) + ' 收盤'} ${f(P)} 計算</p>`;
  const dot = r => { const all = r.ded.map(x => x[1]).concat(P), mx = Math.max(...all), mn = Math.min(...all), pad = (mx - mn) * .15 || 100, W = 300, H = 66, y = v => 17 + (mx + pad - v) / (mx - mn + 2 * pad) * (H - 31), x = i => 20 + i * (W - 40) / 4;
    let s = `<svg class="bars" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${y(P)}" y2="${y(P)}" stroke="#F0E442" stroke-dasharray="4 3"/>`;
    r.ded.forEach((v, i) => { const c2 = v[1] > P ? '#ff5a5a' : '#2ecc71'; s += `<circle cx="${x(i)}" cy="${y(v[1])}" r="4.5" fill="${c2}"/><text x="${x(i)}" y="${y(v[1]) - 7}" font-size="9.5" text-anchor="middle" fill="${c2}">${f(v[1])}</text><text x="${x(i)}" y="${H - 2}" font-size="9.5" text-anchor="middle" fill="#93a3bf">${i ? '+' + (i + 1) + '天' : (isLive ? '今天' : '下一日')}</text>`; });
    return s + '</svg>'; };
  $('#dedBody').innerHTML = `<p class="note">扣抵值＝N 天前的收盤，今天收高於它，均線就往上</p>` + R.map(r => `<div style="border-top:1px solid var(--line);padding:9px 0"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${r.name} ${f(r.ma)} <span class="${r.down ? 'dn' : 'up'}" style="font-size:13px">${r.down ? '▼下彎' : '▲上揚'}</span></b><span class="note" style="margin:0">站上需 ≥ ${f(r.stand)}</span></div>${dot(r)}<div class="note" style="color:#c9d5ea;margin-top:2px">${r.note}</div></div>`).join('') +
    `<p class="note">黃色虛線＝目前指數；紅點＝扣抵值高於現價（壓著均線往下），綠點＝低於現價（均線有機會翻揚）</p>`;
}
// 盤中：更新加權指數區塊（大數字、K線最後一根、扣抵）
function liveIdx(x) {
  const ch = x.z - x.y, p = ch / x.y * 100;
  $('#idxBig').innerHTML = `${fmt(x.z, 2)}<small class="${cls(ch)}">${sg(ch, 2)}（${sg(p, 2)}%）</small>`;
  $('#idxWhen').innerHTML = `<span style="color:#ff5a5a">●</span> 盤中即時 ${RT.hhmmss(x.t)}　開 ${fmt(x.o, 0)}　高 ${fmt(x.h, 0)}　低 ${fmt(x.l, 0)}`;
  const it = window.__TWII;
  if (it && x.d) {
    const b = it.bars.slice(), last = b.at(-1), bar = [x.d, x.o ?? x.z, x.h ?? x.z, x.l ?? x.z, x.z, last[0] === x.d ? last[5] : 0];
    if (last[0] === x.d) b[b.length - 1] = bar; else if (last[0] < x.d) b.push(bar);
    $('#idxK').innerHTML = minik({ ...it, bars: b });
  }
  drawDed(x.z, true);
}
// ---- 盤中即時更新（需先設定 pm/rt.js 的轉接站網址）----
const IDXN = { '01': '水泥工業', '02': '食品工業', '03': '塑膠工業', '04': '紡織纖維', '05': '電機機械', '06': '電器電纜', '08': '玻璃陶瓷', '09': '造紙工業', '10': '鋼鐵工業', '11': '橡膠工業', '12': '汽車工業', '14': '建材營造', '15': '航運業', '16': '觀光餐旅', '17': '金融保險', '18': '貿易百貨', '20': '其他', '21': '化學工業', '22': '生技醫療', '23': '油電燃氣', '24': '半導體業', '25': '電腦週邊', '26': '光電業', '27': '通信網路', '28': '電子零組件', '29': '電子通路', '30': '資訊服務', '31': '其他電子', '32': '文化創意' };
function setTile(id, v, ch, unitPct, label) {
  const t = $('#t-' + id); if (!t || v == null) return;
  t.querySelector('.v').textContent = fmt(v, id === 'sox' ? 0 : 0);
  const tg = t.querySelector('.s .tag'), up = ch > 0;
  t.querySelector('.s').innerHTML = `<span class="${cls(ch)}">${unitPct ? sg(ch, 2) + '%' : sg(ch)}</span> ${tg ? tg.outerHTML : ''}`;
  if (label) t.querySelector('.k').innerHTML = label;
}
function liveInit(J) {
  if (!RT.on) return;
  const SHARE = document.documentElement.classList.contains('share');
  const top = SHARE ? [] : (J.top5?.list || []).map(s => s.code);
  const tick = async () => {
    const st = RT.stockLive(), fs = RT.futSession();
    if (!st && fs == null) { $('#live').textContent = ''; return; }
    try {
      let t = '';
      if (st) {
        const codes = SHARE ? ['tse_t00.tw'] : ['tse_t00.tw', 'otc_o00.tw', ...top.map(c => `tse_${c}.tw`), ...Object.keys(IDXN).flatMap(k => [`tse_t${k}.tw`, `otc_o${k}.tw`])];
        const Q = await RT.q(codes);
        const ix = Q.t00;
        if (ix?.z) { setTile('idx', ix.z, ix.ch); t = ix.t; liveIdx(ix); }
        top.forEach(c => { const x = Q[c], el = $('#px-' + c); if (x?.z && el) el.innerHTML = `${fmt(x.z, 1)}<div class="${cls(x.ch)}" style="font-size:13px">${sg(x.ch, 1)}（${sg(x.p, 2)}%）</div>`; });
        // 產業熱力圖「日」改成即時漲跌（方塊大小仍用前一天成交值）
        const S = window.__SC;
        if (S) for (const [mk, pre] of [['上市', 't'], ['上櫃', 'o']]) (S.markets[mk]?.d || []).forEach(g => {
          const code = Object.keys(IDXN).find(k => IDXN[k] === g.name), x = code && Q[pre + code];
          if (x?.p != null) { g.pct = Math.round(x.p * 100) / 100; g.live = true; }
        });
        if (!SHARE) sectorRedraw();
      }
      if (fs != null && !SHARE) {
        const f = await RT.fut(fs);
        if (f?.z) { setTile('night', f.z, f.ch, false, `${fs ? '台指期夜盤' : '台指期日盤'} <small>即時</small>`); t = t || RT.hhmmss(f.t); }
      }
      $('#live').innerHTML = t ? `<span style="color:#ff5a5a">●</span> 盤中即時 ${RT.hhmmss(t)}` : '';
    } catch (e) { $('#live').innerHTML = '<span class="mut">即時連線失敗，稍後重試</span>'; }
  };
  tick(); setInterval(tick, RT.every);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}
